[build-system]
requires = ["setuptools>=68", "wheel>=0.42"]
build-backend = "setuptools.build_meta"

[project]
name = "omoikane-os"
version = "0.1.2"
description = "Reference implementation scaffold for OmoikaneOS."
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-Proprietary-Until-Governance"
authors = [
  { name = "yasufumi" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent"
]
dependencies = [
  "jsonschema>=4.0",
  "PyYAML>=6.0"
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "tomli>=2.0; python_version < '3.11'"
]

[project.scripts]
omoikane = "omoikane.cli:main"

[project.urls]
Repository = "https://github.com/yasufumi-nakata/omoikane"

[tool.setuptools]
include-package-data = false
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.exclude-package-data]
"*" = ["*.py[cod]", "__pycache__/*", ".DS_Store"]

[tool.pytest.ini_options]
testpaths = ["tests"]
