[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omoikane-os"
version = "0.1.0"
description = "Reference implementation scaffold for OmoikaneOS."
readme = "README.md"
requires-python = ">=3.9"
license = "LicenseRef-Proprietary-Until-Governance"
authors = [
  { name = "yasufumi" }
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "jsonschema>=4.0",
  "PyYAML>=6.0"
]

[project.scripts]
omoikane = "omoikane.cli:main"

[project.urls]
Repository = "https://github.com/yasufumi-nakata/omoikane"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
