eval_id: parallel_codex_integration_execution
target: selfctor.parallel_orchestration
summary: >
  parallel-orchestration-demo が integration-ready batch receipt を main checkout
  適用直前の execution receipt へ縮約し、source batch digest、current head、
  ordered apply plan digest、patch artifact digest に束縛された command-bound
  git apply dry-run manifest、post-apply verification manifest、raw batch /
  apply / dry-run / worker / verification payload 非保存を固定すること
checks:
  - name: parallel Codex integration execution smoke
    command: PYTHONPATH=src python3 -m omoikane.cli parallel-orchestration-demo --json
expect:
  execution_receipt_profile: parallel-codex-integration-execution-plan-v1
  execution_ready_to_apply: true
  execution_source_batch_receipt_digest_bound: true
  execution_current_head_matches_batch: true
  execution_apply_plan_digest_bound: true
  execution_pre_apply_dry_run_manifest_digest_bound: true
  execution_pre_apply_dry_run_command_bound: true
  execution_pre_apply_patch_artifact_digest_bound: true
  execution_pre_apply_command_receipt_digest_bound: true
  execution_pre_apply_dry_run_passed: true
  execution_post_apply_verification_manifest_digest_bound: true
  execution_required_verifications_passed: true
  execution_raw_batch_payload_redacted: true
  execution_raw_apply_plan_payload_redacted: true
  execution_raw_pre_apply_dry_run_payload_redacted: true
  execution_raw_worker_receipt_payload_redacted: true
  execution_raw_verification_payload_redacted: true
  conflict_execution_blocked: true
  conflict_execution_blocked_on_source_batch: true
  conflict_execution_apply_plan_digest_bound: true
  raw_batch_payload_stored: false
  raw_apply_plan_payload_stored: false
  raw_pre_apply_dry_run_payload_stored: false
  raw_worker_receipt_payload_stored: false
  raw_verification_payload_stored: false
metric: boolean
threshold: 1.0
ethics_check: true
