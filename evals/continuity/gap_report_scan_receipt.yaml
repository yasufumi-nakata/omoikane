eval_id: gap_report_scan_receipt
target: self_construction.gap_report
level: L5
description: >
  gap-report が all-zero / non-zero 判定、prioritized task count、scan surface、
  top-level eval inventory、report digest、各 truth-source の surface digest manifest、continuity ledger 用
  event ref / digest と実 ContinuityLedger append entry を public schema と digest-bound receipt に固定し、
  build / cache / platform metadata 生成物の path manifest、ignored generated artifact、
  ignored platform metadata、decision-log README index drift も含めて
  automation gate の判定形を reviewer-facing に検証できること
inputs:
  - source: reference-runtime
    command: PYTHONPATH=src python3 -m omoikane.cli gap-report --json
expected:
  schema_valid: true
  scan_receipt_profile: self-construction-gap-report-scan-receipt-v1
  all_zero: true
  missing_required_reference_policy_section_count: 0
  worktree_workspace_marker_count: 0
  tracked_generated_artifact_count: 0
  untracked_generated_artifact_count: 0
  ignored_generated_artifact_count: 0
  ignored_platform_metadata_count: 0
  decision_log_index_inventory_count: 0
  validation_ok: true
  counts_match_report: true
  report_digest_bound: true
  scan_surface_digests_bound: true
  top_level_eval_inventory_surface_bound: true
  surface_manifest_digest_bound: true
  continuity_ledger_bound: true
  continuity_event_digest_bound: true
  continuity_ledger_appended: true
  continuity_ledger_entry_digest_bound: true
  continuity_ledger_payload_ref_bound: true
  continuity_ledger_signature_roles_bound: true
  continuity_ledger_signature_roles:
    - self
    - guardian
  prioritized_tasks_empty_when_all_zero: true
  raw_report_payload_stored: false
  raw_surface_payload_stored: false
  tracked_worktree_diff_surface_bound: true
  tracked_generated_artifacts_surface_bound: true
  untracked_generated_artifacts_surface_bound: true
  ignored_generated_artifacts_surface_bound: true
  ignored_platform_metadata_surface_bound: true
  decision_log_index_inventory_gate_bound: true
  raw_artifact_payload_stored: false
  raw_continuity_event_payload_stored: false
metric: boolean
threshold: 1.0
ethics_check: true
