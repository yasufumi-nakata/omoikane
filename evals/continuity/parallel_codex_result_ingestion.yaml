eval_id: parallel_codex_result_ingestion
target: selfctor.parallel_orchestration
summary: >
  parallel-orchestration-demo が worker result の patch digest、changed files、
  verification result、base commit freshness、signed worker identity、remote
  branch / PR metadata、remote source revocation check、freshness window、
  signed provider timestamp、timestamp replay guard、remote source content identity、
  remote source main-head ancestry を main checkout integration 前の digest-only receipt として
  固定し、repo-local diff classifier または structured patch-segment manifest で検出した workspace-enacted marker-only result、
  stale worker result、unrelated ancestry result を fail-closed にすること
checks:
  - name: parallel Codex worker result ingestion smoke
    command: PYTHONPATH=src python3 -m omoikane.cli parallel-orchestration-demo --json
expect:
  schema_valid: true
  ready_receipt_profile: parallel-codex-worker-result-ingestion-v1
  ready_for_main_checkout: true
  ready_changed_file_manifest_digest_bound: true
  ready_verification_manifest_digest_bound: true
  ready_required_verifications_passed: true
  ready_worker_identity_evidence_bound: true
  ready_workspace_marker_hygiene_clean: true
  ready_workspace_marker_hygiene_digest_bound: true
  ready_receipt_digest_bound: true
  remote_ready_for_main_checkout: true
  remote_branch_pr_metadata_bound: true
  remote_source_revocation_digest_bound: true
  remote_source_revocation_freshness_digest_bound: true
  remote_source_revocation_timestamp_digest_bound: true
  remote_source_revocation_timestamp_signature_bound: true
  remote_source_revocation_timestamp_replay_guard_digest_bound: true
  remote_source_revocation_not_revoked: true
  remote_source_revocation_fresh: true
  remote_source_revocation_timestamp_signed_current: true
  remote_source_revocation_timestamp_unique: true
  remote_source_content_digest_bound: true
  remote_source_content_bound: true
  remote_source_content_status_bound: true
  remote_source_ancestry_digest_bound: true
  remote_source_ancestry_bound: true
  remote_source_ancestry_status_bound: true
  remote_source_base_commit_matches_worker: true
  remote_review_authority_digest_bound: true
  remote_accepted_source_policy_digest_bound: true
  remote_worker_identity_evidence_bound: true
  remote_raw_metadata_payload_redacted: true
