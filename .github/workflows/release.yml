name: Release

'on':
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing git tag to publish, such as v0.1.0.
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Publish GitHub Release and GHCR package
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          version="${tag#v}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Resolve checked-out revision
        id: revision
        shell: bash
        run: |
          echo "full_sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
          echo "short_sha=$(git rev-parse --short=12 HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Run release verification
        run: |
          python -m unittest discover -s tests -t .
          python -m omoikane.cli version-demo --json > release-manifest.json
          python -m omoikane.cli gap-report --json > gap-report.json

      - name: Build wheel and source distribution
        run: python -m build

      - name: Verify installed wheel
        run: |
          python -m venv /tmp/omoikane-install-check
          /tmp/omoikane-install-check/bin/python -m pip install --upgrade pip
          /tmp/omoikane-install-check/bin/python -m pip install dist/*.whl
          /tmp/omoikane-install-check/bin/omoikane demo --json > installed-demo.json

      - name: Generate release checksums and notes
        run: |
          sha256sum dist/* release-manifest.json gap-report.json installed-demo.json > SHA256SUMS
          cat > RELEASE_NOTES.md <<'EOF'
          OmoikaneOS reference runtime release.

          Attached assets:
          - Python wheel and source distribution.
          - Release manifest generated by `omoikane version-demo --json`.
          - Gap report generated by `omoikane gap-report --json`.
          - Installed wheel smoke output.
          - SHA256 checksums.

          The matching GitHub Packages image is published to GHCR.
          EOF

      - name: Log in to GitHub Container Registry
        run: echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build release container image
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=${{ steps.release.outputs.version }}" \
            --label "org.opencontainers.image.revision=${{ steps.revision.outputs.full_sha }}" \
            --tag "${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}" \
            --tag "${{ steps.release.outputs.image }}:${{ steps.release.outputs.tag }}" \
            --tag "${{ steps.release.outputs.image }}:latest" \
            .

      - name: Push release container image
        run: |
          docker push "${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}"
          docker push "${{ steps.release.outputs.image }}:${{ steps.release.outputs.tag }}"
          docker push "${{ steps.release.outputs.image }}:latest"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.release.outputs.tag }}"
          assets=(dist/* release-manifest.json gap-report.json installed-demo.json SHA256SUMS)
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" "${assets[@]}" --clobber
          else
            gh release create "${tag}" "${assets[@]}" \
              --verify-tag \
              --title "OmoikaneOS ${tag}" \
              --notes-file RELEASE_NOTES.md
          fi
