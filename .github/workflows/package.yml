name: Package

'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  python-package:
    name: Build Python package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Run package smoke checks
        run: |
          python -m omoikane.cli demo --json > /tmp/omoikane-demo.json
          python -m omoikane.cli gap-report --json > /tmp/omoikane-gap-report.json

      - name: Build wheel and source distribution
        run: python -m build

      - name: Upload Python package artifact
        uses: actions/upload-artifact@v4
        with:
          name: omoikane-python-package
          path: dist/*
          if-no-files-found: error

  container-package:
    name: Publish GHCR container package
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve image tags
        id: image
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::12}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "short_sha=${short_sha}" >> "${GITHUB_OUTPUT}"

      - name: Log in to GitHub Container Registry
        run: echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build container image
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${{ steps.image.outputs.image }}:main" \
            --tag "${{ steps.image.outputs.image }}:sha-${{ steps.image.outputs.short_sha }}" \
            .

      - name: Push container image
        run: |
          docker push "${{ steps.image.outputs.image }}:main"
          docker push "${{ steps.image.outputs.image }}:sha-${{ steps.image.outputs.short_sha }}"
